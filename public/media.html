<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birgə media pleyeri</title>
<style>html,body{margin:0;height:100%;background:#070a10;color:#eee;font:14px system-ui}#mediaShell{height:100%;display:flex;flex-direction:column}video{display:block;width:100%;flex:1;min-height:0;object-fit:contain}#mediaControls{padding:10px 14px;background:#151a28;display:flex;flex-wrap:wrap;gap:10px;align-items:center}#mediaControls button,#mediaControls select{min-height:38px;padding:7px 12px;border:1px solid #3a4054;border-radius:8px;background:#242b3d;color:#fff;font:inherit;cursor:pointer}#mediaControls label{display:flex;gap:6px;align-items:center}#mediaSeek{flex:1;min-width:80px;accent-color:#8a7aff}#mediaVolume{width:90px;accent-color:#8a7aff}#mediaClock{font-variant-numeric:tabular-nums;white-space:nowrap}#mediaError{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#10131d}#mediaError[hidden]{display:none}#mediaError p{max-width:480px;line-height:1.6}@media(max-width:480px){#mediaControls{gap:6px;padding:8px}#mediaSeek{flex-basis:60%}#mediaClock{font-size:12px}#mediaVolume{width:65px}}</style>
<script src="/media-bridge.js"></script><script src="/vendor/hls.min.js"></script><script src="/js/translations.js"></script>
<script src="/js/i18n.js"></script>
</head>
<body><div id="mediaShell"><video id="mediaPlayer" controls playsinline autoplay preload="metadata"></video><div id="mediaControls">
<button id="mediaToggle" type="button" disabled>▶ Başlat</button><input id="mediaSeek" type="range" min="0" max="0" value="0" step="0.1" aria-label="Video vaxtı"><span id="mediaClock">00:00 / 00:00</span>
<button id="mediaMute" type="button" aria-label="Səsi bağla">🔊</button><label>Səs <input id="mediaVolume" type="range" min="0" max="1" value="1" step="0.05" aria-label="Səs səviyyəsi"></label><label>Sürət <select id="mediaRate" aria-label="Oynatma sürəti"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select></label><button id="mediaFullscreen" type="button" aria-label="Tam ekran">⛶</button>
</div></div><div id="mediaError" role="alert" hidden><p id="mediaErrorMessage"></p></div><script src="/js/media-player.js"></script></body></html>
