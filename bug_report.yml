name: Bug report
description: Report a reproducible problem with Mirelix Homelab.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and the steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App commit/version, Docker or Node, OS, browsers, participant count, and HTTP/HTTPS setup.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, signed URL tokens, and private network details before posting.
      render: text
